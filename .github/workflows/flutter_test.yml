name: Flutter Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0' # Adjust as needed
          channel: 'stable'

      - name: Install dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Analyze project source
        working-directory: ./mobile_app
        run: flutter analyze

      - name: Run tests
        working-directory: ./mobile_app
        run: flutter test
