name: Deploy Next.js site to Pages

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next
          enablement: true
      - name: Install dependencies
        run: npm ci || npm install
      - name: Setup Firebase Config
        run: cp utils/firebase.template.js utils/firebase.js
      - name: Build with Next.js
        run: npm run build
      - name: Upload artifact
        # Only upload artifact if it's not a pull request, since PRs can't deploy
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    # Only run deploy job for pushes to main branch, or manual dispatch.
    # We still run the 'build' job for pull requests to verify compilation,
    # but GitHub Pages environments block PR deployments by default.
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
